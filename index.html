<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FuelEU Compliance Balance</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
        }

        .container {
            width: 350px;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(12px);
            border-radius: 20px;
            padding: 30px;
            text-align: center;
            color: #fff;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        /* Animated logo styling */
        .ship-logo {
            width: 85px;
            margin-bottom: 12px;
            filter: drop-shadow(0 0 12px rgba(0, 212, 255, 0.5));
        }

        .logo {
            font-size: 26px;
            font-weight: 600;
            margin-bottom: 20px;
            letter-spacing: 1px;
        }

        .logo span {
            color: #00d4ff;
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 10px;
            background: #00d4ff;
            color: #000;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
            transition: 0.3s;
        }

        button:hover {
            background: #00a8cc;
            color: #fff;
        }

        .result {
            margin-top: 20px;
            font-size: 18px;
            font-weight: 500;
            color: #00ffae;
        }

        .footer {
            margin-top: 15px;
            font-size: 12px;
            opacity: 0.7;
        }
    </style>
</head>

<body>

    <div class="container">

        <!-- 🔥 Animated Ship Logo -->
        <svg class="ship-logo" viewBox="0 0 88 88" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <linearGradient id="smokeGrad" x1="0" x2="1" y1="0" y2="1">
                    <stop offset="0%" stop-color="#a8ffea" />
                    <stop offset="100%" stop-color="#00d4ff" />
                </linearGradient>

                <linearGradient id="hull" x1="0" x2="1">
                    <stop offset="0%" stop-color="#0f2027" />
                    <stop offset="100%" stop-color="#2c5364" />
                </linearGradient>
            </defs>

            <!-- Animated Smoke -->
            <g>
                <circle cx="58" cy="28" r="5" fill="url(#smokeGrad)" opacity="0.8">
                    <animate attributeName="cy" values="28;18;28" dur="3s" repeatCount="indefinite" />
                    <animate attributeName="opacity" values="0.8;0.2;0.8" dur="3s" repeatCount="indefinite" />
                </circle>

                <circle cx="65" cy="24" r="4" fill="url(#smokeGrad)" opacity="0.6">
                    <animate attributeName="cy" values="24;14;24" dur="3.5s" repeatCount="indefinite" />
                    <animate attributeName="opacity" values="0.6;0.1;0.6" dur="3.5s" repeatCount="indefinite" />
                </circle>

                <circle cx="70" cy="20" r="3" fill="url(#smokeGrad)" opacity="0.5">
                    <animate attributeName="cy" values="20;10;20" dur="4s" repeatCount="indefinite" />
                    <animate attributeName="opacity" values="0.5;0.1;0.5" dur="4s" repeatCount="indefinite" />
                </circle>
            </g>

            <!-- Ship -->
            <rect x="41" y="36" width="9" height="6" rx="1.5" fill="#ffffff" />
            <rect x="52" y="32" width="4" height="10" rx="1" fill="#00d4ff" />

            <path d="M12 52h56l-6 10c-1.4 2.3-4 3.7-6.8 3.7H30.8c-2.8 0-5.3-1.4-6.8-3.7L18 52z" fill="url(#hull)"
                stroke="#00d4ff" stroke-width="1.2" />

            <!-- Windows -->
            <circle cx="30" cy="55.5" r="1.6" fill="#a8ffea" />
            <circle cx="36" cy="55.5" r="1.6" fill="#a8ffea" />
            <circle cx="42" cy="55.5" r="1.6" fill="#a8ffea" />
            <circle cx="48" cy="55.5" r="1.6" fill="#a8ffea" />
            <circle cx="54" cy="55.5" r="1.6" fill="#a8ffea" />

            <!-- Waves -->
            <path d="M14 68c4.5 3.5 9 3.5 13.5 0 4.5 3.5 9 3.5 13.5 0 4.5 3.5 9 3.5 13.5 0 4.5 3.5 9 3.5 13.5 0"
                fill="none" stroke="#00d4ff" stroke-width="2.2" stroke-linecap="round" />
        </svg>

        <div class="logo">Fuel<span>EU</span></div>
        <h3>Pooling of Compliance</h3>

        <button onclick="checkBalance()">Check Balance</button>

        <div class="result" id="result"></div>

        <div class="footer"></div>
    </div>

    <script>
        function checkBalance() {
            window.location.href = 'calculate.html';
        }
    </script>

</body>

</html>
